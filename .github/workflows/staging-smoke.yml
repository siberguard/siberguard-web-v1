# Smoke test setelah Vercel selesai men-deploy staging (branch `development`).
# Hanya-baca: tidak menulis data ke database staging.
# Perlu repository variable STAGING_URL (Settings → Secrets and variables → Actions → Variables),
# mis. https://siberguard-staging.vercel.app — tanpa garis miring di akhir.
name: Smoke test staging

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test staging
    # Project Vercel staging hanya mem-build `development` (vercel.json → ignoreCommand),
    # jadi deployment "Production" yang sukses = staging terbaru.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: URL staging
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::error::Repository variable STAGING_URL belum diisi."
            exit 1
          fi
          echo "Menguji $STAGING_URL"

      - name: Health check (aplikasi & database)
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$STAGING_URL/api/health" | tee health.json
          echo
          grep -q '"status":"ok"' health.json

      - name: Halaman utama tampil
        run: |
          for path in / /en /kuesioner /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$STAGING_URL$path")
            echo "$path → $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Staging tidak diindeks mesin pencari
        run: |
          curl -fsS "$STAGING_URL/robots.txt" | tee robots.txt
          grep -qiE '^disallow: /\s*$' robots.txt
          curl -fsS -o /dev/null -D headers.txt "$STAGING_URL/"
          grep -qi '^x-robots-tag: noindex' headers.txt
