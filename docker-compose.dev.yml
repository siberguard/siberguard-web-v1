# Layanan pendukung untuk development lokal.
# Jalankan: docker compose -f docker-compose.dev.yml up -d
name: soc-merdeka-dev

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all', '--quiet']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Inisialisasi replica set 1 node saat pertama kali jalan (transaksi Payload butuh replica set).
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # UI web: http://localhost:8025

volumes:
  mongo-data:
